services:
  # runs on EVERY worker in cluster.yaml (the head included) — each host gets its own data port
  # (TASKMANAGER_DATA_PORT + worker index) so peers can tunnel to it over the :22-only path.
  # all advertised hosts are 127.0.0.1: peers reach this node through the ssh -L tunnels deploy.py
  # spawns, and same-host traffic is loopback anyway.
  taskmanager:
    image: ${FLINK_IMAGE}
    pull_policy: never
    network_mode: host
    command:
      - taskmanager
      - -D
      - jobmanager.rpc.address=${JOBMANAGER_HOST}
      - -D
      - jobmanager.rpc.port=${JOBMANAGER_RPC_PORT}
      - -D
      - blob.server.port=${BLOB_SERVER_PORT}
      - -D
      - blob.client.socket.timeout=1800000
      - -D
      - taskmanager.host=${TASKMANAGER_HOST}
      - -D
      - taskmanager.data.port=${TASKMANAGER_DATA_PORT}
      - -D
      - taskmanager.data.bind-port=${TASKMANAGER_DATA_BIND_PORT}
      - -D
      - taskmanager.numberOfTaskSlots=${SLOTS}
      - -D
      - taskmanager.memory.process.size=${MEMORY}
    user: "0:0"
    restart: unless-stopped

  sdkworker:
    # beam sdk worker pool (EXTERNAL environment) — python user code runs HERE, not in
    # taskmanager-spawned containers, so this is the only place the fullmap mount can live;
    # rootful docker on all hosts, so default root can read the host-owned redb; no socket needed,
    # the pool never launches containers
    image: ${WORKER_IMAGE}
    pull_policy: never
    network_mode: host
    command: ["--worker_pool"]
    working_dir: /opt/outputs
    environment:
      # the beam sdk image defaults to an unprivileged user that cannot create /opt/apache/beam-venv;
      # root also reads the host-owned redb bundle under the fullmap mount
      RUN_PYTHON_SDK_IN_DEFAULT_ENVIRONMENT: "1"
      # pipeline code resolves the redb through relmedner.constants.FULLMAP_DIR, which honors this
      # override — point it at the read-only bundle mount, not the host path (invisible in here)
      RELMEDNER_FULLMAP_DIR: ${FULLMAP_MOUNT}
    volumes:
      - ${FULLMAP_DIR}:${FULLMAP_MOUNT}:ro
      # avro shards land here; the host side is collected onto the head host when the job finishes
      - ${OUTPUTS_DIR}:${OUTPUTS_MOUNT}
    restart: unless-stopped
