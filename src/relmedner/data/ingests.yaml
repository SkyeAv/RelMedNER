datasets:
  - task:
      type: script
      name: GlinerBiomedScript
      outputs:
        - entities
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-pre-training
    split: train
    columns_out:
      - tokenized_text
      - ner
  - task:
      type: fullmap
      outputs:
        - entities
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-curated-corpus
    split: train
    columns_out:
      - text
