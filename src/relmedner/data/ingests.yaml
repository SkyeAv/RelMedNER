datasets:
  - task:
      type: script
      name: GlinerBiomedScript
      outputs:
        - entities
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-pre-training
    split: train
    columns_out:
      - tokenized_text
      - ner
  - task:
      type: script
      name: PileNerBiomedScript
      outputs:
        - entities
    source: hf
    dataset: disi-unibo-nlp/Pile-NER-biomed-IOB
    split: train
    columns_out:
      - tokens
      - ner_tags
  - task:
      type: fullmap
      outputs:
        - entities
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-curated-corpus
    split: train
    columns_out:
      - text
  - task:
      type: fullmap
      outputs:
        - entities
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-balanced-curated-corpus
    split: train
    columns_out:
      - text
  - task:
      type: script
      name: GlinerBiomedPostScript
      outputs:
        - entities
        - classifications
        - structures
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-post-training
    split: train
    columns_out:
      - tokenized_text
      - ner
      - negatives
  - task:
      type: script
      name: KnowledgatorBiomedScript
      outputs:
        - entities
    source: hf
    dataset: knowledgator/biomed_NER
    split: train
    columns_out:
      - text
      - entities
