datasets:
  - task:
      type: script
      name: GlinerBiomedScript
      outputs:
        - entities
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-pre-training
    split: train
    weight: 1.0
    columns_out:
      - tokenized_text
      - ner
  - task:
      type: script
      name: PileNerBiomedScript
      outputs:
        - entities
    source: hf
    dataset: disi-unibo-nlp/Pile-NER-biomed-IOB
    split: train
    weight: 1.0
    columns_out:
      - tokens
      - ner_tags
  - task:
      type: script
      name: SentenceRexScript
      outputs:
        - relations
    source: hf
    dataset: knowledgator/sentence_rex
    split: train
    weight: 1.0
    columns_out:
      - sentences
      - labels
  - task:
      type: script
      name: PileNerTypeScript
      outputs:
        - entities
    source: hf
    dataset: Universal-NER/Pile-NER-type
    split: train
    weight: 1.0
    columns_out:
      - conversations
  - task:
      type: fullmap
      outputs:
        - entities
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-curated-corpus
    split: train
    weight: 1.0
    columns_out:
      - text
  - task:
      type: fullmap
      outputs:
        - entities
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-balanced-curated-corpus
    split: train
    weight: 1.0
    columns_out:
      - text
  - task:
      type: script
      name: CtkpInterventionsScript
      outputs:
        - entities
    source: local
    weight: 1.0
    path: ~/Desktop/interventions.avro
  - task:
      type: script
      name: GlinerBiomedPostScript
      outputs:
        - entities
        - classifications
        - structures
        - relations
    source: hf
    dataset: anthonyyazdaniml/gliner-biomed-post-training
    split: train
    weight: 1.0
    columns_out:
      - tokenized_text
      - ner
      - negatives
  - task:
      type: script
      name: KnowledgatorBiomedScript
      outputs:
        - entities
    source: hf
    dataset: knowledgator/biomed_NER
    split: train
    weight: 1.0
    columns_out:
      - text
      - entities
  - task:
      type: script
      name: GlinerMultilingualScript
      outputs:
        - entities
    source: hf
    dataset: knowledgator/gliner-multilingual-synthetic
    split: train
    weight: 1.0
    columns_out:
      - tokenized_text
      - ner
