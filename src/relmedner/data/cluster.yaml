ssh_user: sgoetz

# head host: runs the jobmanager stack AND its own taskmanager + sdkworker. deploy, `build-dataset`,
# and shard collection all run from this host's checkout (tmux), so "local" in the old sense — a
# laptop worker — is gone entirely. every listed host also serves taskmanager duty.
jobmanager: 10.2.9.11

workers:
  # fullmap points at the host directory holding the fullmap redb bundle (primary redb + <stem>.s<N>.redb
  # shards), NOT the redb file itself; it is bind-mounted read-only into the sdkworker at /opt/fullmap.
  # outputs is the host directory the sdkworker writes avro shards into (mounted rw at /opt/outputs);
  # shards are collected onto the head host when the job finishes.
  # measured 2026-09-24: 80 CPU / 187 GB RAM (152 GB available with the resident llama-server).
  - host: 10.2.9.11 # wenceslaus — head node (jobmanager + taskmanager + sdkworker)
    slots: 64
    memory: 112g
    fullmap: /local_raid1/sgoetz/DBSTORE/FULLMAP/fullmap
    outputs: /local_raid1/sgoetz/DBSTORE/FULLMAP/outputs
  # measured 2026-09-24: 40 CPU / 125 GB RAM (102 GB available); docker has no compose plugin —
  # standalone docker-compose lives in the nix profile. cross-host traffic is :22-only, so the
  # flink rpc/blob/shuffle ports ride ssh -L tunnels spawned by deploy (see deploy.py).
  - host: 10.2.9.19 # hypatia
    slots: 16
    memory: 40g
    fullmap: /ssd2/sgoetz/fullmap
    outputs: /ssd2/sgoetz/outputs
