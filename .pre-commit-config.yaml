repos:
  - repo: local
    hooks:
      # commit stage stays sub-second AND permissive: ruff check on the staged files only.
      # No format check, no suite: running the whole suite per commit cost ~80s and trained
      # people to pass --no-verify, which gates nothing.
      - id: lint
        name: ruff check (staged files)
        entry: uv run ruff check
        language: system
        types: [file, python]
        stages: [pre-commit]
      # the push boundary runs static checks + the fast suite once per pushed batch (no
      # coverage measurement). The measured 90% coverage gate is the wenceslaus full gate's
      # job (make test / remote-gate.sh cov), never the laptop's.
      - id: prepush
        name: make prepush
        entry: make prepush
        language: system
        pass_filenames: false
        stages: [pre-push]
